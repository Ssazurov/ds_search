# RU-ключевики для keyword/BM25-эвристики (issue #21, ADR-002 п.6).
# Ключи верхнего уровня category/doc_type/target_audience ДОЛЖНЫ совпадать
# со значениями в config/categories.yaml (directions.<direction>, doc_types,
# target_audiences) — классификатор использует categories.yaml как список
# допустимых меток, а этот файл — как источник RU-словоформ для сопоставления
# по сниппету/тайтлу. При добавлении новой категории в categories.yaml нужно
# добавить и её ключевики сюда, иначе классификатор её не предложит (это ок:
# suggested_* просто останется null).
#
# Отдельный файл (не внутри categories.yaml), чтобы не конфликтовать с
# ui/dictionaries_tab.py: save_dictionaries() перезаписывает categories.yaml
# только ключами directions/doc_types/target_audiences/age_groups/
# license_statuses (src/metadata/schema.py) и стёр бы любой посторонний ключ.

category:
  prenatalnaya-diagnostika-i-pervye-nedeli-posle-diagnoza: [пренатальн, скрининг, генетика, хромосом, трисомия, диагностика, первые недели после диагноза]
  medicinskoe-nablyudenie: [сопутствующ, порок сердца, диспансерн, медицинское наблюдение, обследование у врача]
  pitanie-son-fizicheskaya-aktivnost: [питание, режим сна, физическая активность, моторика, двигательн, координация]
  psihicheskoe-zdorove: [психическое здоровье, тревожность, депрессия, эмоциональн]
  vozrastnye-izmeneniya-i-demenciya: [возрастные изменения, деменция, старение, альцгеймер]
  palliativnaya-pomosch-i-uhod-v-konce-zhizni: [паллиативн, уход в конце жизни, хоспис]

  rannee-vmeshatelstvo: [раннее вмешательство, ранняя помощь, реабилитация, абилитация, коррекция]
  logopediya-i-alternativnaya-kommunikaciya: [логопед, произношение, артикуляция, звукопроизношение, альтернативная коммуникация, развитие речи]
  metodiki-obucheniya-i-korrekcii-povedeniya: [методика, эффективность метода, доказательн, коррекция поведения]
  kognitivnoe-razvitie: [когнитивное развитие, мышление, память, внимание]
  bytovaya-samostoyatelnost: [бытовая самостоятельность, самообслуживание]
  assistivnye-tehnologii: [ассистивные технологии, технические средства реабилитации, вспомогательные устройства]

  doshkolnoe-i-shkolnoe-obrazovanie-inklyuziya: [школа, подготовка к школе, инклюзия, инклюзивн, детский сад, педагог, право на образование]
  profobuchenie-i-proforientaciya: [профобучение, профориентация, колледж]
  trudoustroystvo-i-soprovozhdaemaya-zanyatost: [трудоустройство, сопровождаемая занятость]
  samozanyatost: [самозанятость, предпринимательство]
  praktiki-rabotodateley: [работодатель, инклюзивный бизнес]

  druzhba-lyubov-partnerstvo: [дружба, любовь, партнерство, отношения]
  lichnye-granicy-i-bezopasnost: [личные границы, безопасность, согласие]
  dosug-i-soobschestva: [досуг, социализация, адаптация в обществе, общение со сверстниками]
  lichnyy-opyt-lyudey-s-sd: [личный опыт, история человека с синдромом дауна]

  perehod-vo-vzroslost: [переход во взрослость, совершеннолетие]
  prozhivanie: [сопровождаемое проживание, самостоятельное проживание]
  opeka-podderzhka-prinyatiya-resheniy: [дееспособность, опека, попечительство, поддерживаемое принятие решений]
  prava-lgoty-vyplaty: [льгота, пособие, инвалидность, закон об образовании, доступная среда]
  finansy-i-dokumenty: [финансы, оформление документов]
  planirovanie-posle-nas: [планирование будущего, после нас]

  pervaya-reakciya-na-diagnoz: [первая реакция на диагноз, известие о диагнозе, шок от диагноза]
  psihologicheskaya-podderzhka-na-vseh-etapah: [психологическая поддержка, помощь семье]
  obuchenie-roditeley-i-blizkih: [обучение родителей, школа родителей, тренинг для родителей]
  soobschestva-i-vzaimopomosch: [сообщество родителей, взаимопомощь, группа поддержки]
  advocacy-i-zaschita-prav: [защита прав, адвокация, правозащита]
  gore-i-utrata: [горе, утрата, потеря близкого]
  issledovaniya-i-opyt-semey: [эпидемиология, распространенность, частота встречаемости, исследование опыта семей]

doc_type:
  book: [книга, издание]
  guide: [руководство, пособие, методичка]
  article: [статья]
  law: [закон, постановление, приказ, нормативный акт]
  dissertation: [диссертация, автореферат]
  clinical_recommendation: [клинические рекомендации, клинический протокол]
  brochure: [брошюра, буклет, памятка]
  program: [программа, курс занятий]
  systematic_review: [систематический обзор, метаанализ]
  report: [отчет, отчёт, доклад]

target_audience:
  parents: [родител, мам, пап, семь]
  specialists: [специалист, педагог, логопед, дефектолог, врач]
  researchers: [исследовател, ученый, учёный, научный сотрудник]
