# Конфиг LLM для автозаполнения GAR-поля keywords (issue #110, ADR-007).
# Формат совпадает с news_llm.yaml (src/news/llm_draft.py: LlmConfig/
# load_llm_config/call_llm переиспользуются, только prompt_template свой).
provider: anthropic
model: claude-sonnet-4-6
endpoint: https://api.anthropic.com/v1/messages
temperature: 0.2
max_tokens: 300
timeout_s: 60
prompt_template: |
  Извлеки 5-10 ключевых слов/словосочетаний на русском языке из текста
  документа ниже. Ключевые слова должны отражать тему, целевую аудиторию
  и практическую пользу документа (для поиска в базе знаний по синдрому
  Дауна и РАС). Без общих слов вроде "статья", "информация".

  Заголовок: {title}
  Текст:
  ---
  {text}
  ---

  Верни ТОЛЬКО список ключевых слов через запятую, без нумерации, без
  markdown, без пояснений. Пример формата ответа:
  синдром Дауна, ранняя помощь, развитие речи, инклюзия, родителям
