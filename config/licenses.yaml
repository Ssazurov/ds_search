# Реестр лицензий/ToS источников (issue #3, ADR-001 п.3).
asi.org.ru:
  attribution_template: 'Источник: {title} ({source_url}), Агентство социальной информации
    (asi.org.ru)'
  checked_date: '2026-09-17'
  notes: 'Собственная статья АСИ "Как не нарушить авторские права": при цитировании
    материалов АСИ не более 30% – указать ссылку на asi.org.ru; при цитировании более
    30% – направить уведомительное письмо в редакцию. Фотоматериалы – только по согласованию
    с АСИ/автором, отдельно от текста.'
  status: attribution_required
correiodamanha.com.br:
