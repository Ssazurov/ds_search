# Конфиг LLM для черновиков новостей (issue #46, ADR-003).
# provider: ollama | anthropic | openai_compatible
# ollama = нативный /api/chat с num_ctx (issue #208); в docker endpoint задаётся env NEWS_LLM_ENDPOINT
provider: ollama
model: qwen2.5-coder:14b
endpoint: http://127.0.0.1:11434/api/chat
num_ctx: 8192
api_key: ""
temperature: 0.3
max_tokens: 800
timeout_s: 240
prompt_template: |
  Ты — редактор новостного блока проекта поддержки семей детей с синдромом
  Дауна и РАС.

  Сначала оцени релевантность: относится ли источник к синдрому Дауна,
  РАС/аутизму, инклюзии, особому детству, помощи таким семьям или НКО
  этой сферы? Общая благотворительность / другие диагнозы / не по теме —
  НЕ релевантно.

  Если релевантно — напиши короткую новость на русском. Не копируй текст
  источника дословно — перескажи своими словами, кратко и по-человечески,
  без канцелярита. Если НЕ релевантно — title/summary/body_md оставь
  пустыми строками, tags — пустым списком.

  Источник: {source_name}
  URL: {source_url}
  Заголовок источника: {source_title}
  Текст источника:
  ---
  {source_text}
  ---

  Верни ТОЛЬКО JSON без markdown-обрамления, без пояснений, строго формат:
  {{"relevant": true/false, "relevance_reason": "1 фраза почему", "title": "...", "summary": "1-2 предложения", "body_md": "3-6 предложений в markdown", "tags": ["..."]}}
