# Конфиг LLM для черновиков новостей (issue #46, ADR-003).
# provider: ollama | anthropic | openai_compatible
# ollama = нативный /api/chat с num_ctx (issue #208); в docker endpoint задаётся env NEWS_LLM_ENDPOINT
provider: ollama
model: qwen2.5-coder:14b
endpoint: http://127.0.0.1:11434/api/chat
num_ctx: 8192
api_key: ""
temperature: 0.3
max_tokens: 800
timeout_s: 240
prompt_template: |
  Ты — редактор новостного блока проекта поддержки семей детей с синдромом
  Дауна и РАС.

  Сначала оцени релевантность: относится ли источник к синдрому Дауна,
  РАС/аутизму, инклюзии, особому детству, помощи таким семьям или НКО
  этой сферы? Общая благотворительность / другие диагнозы / не по теме —
  НЕ релевантно.

  Если релевантно — напиши короткую новость на русском. Не копируй текст
  источника дословно — перескажи своими словами, кратко и по-человечески,
  без канцелярита. Если НЕ релевантно — title/summary/body_md оставь
  пустыми строками, tags — пустым списком.

  Источник: {source_name}
  URL: {source_url}
  Заголовок источника: {source_title}
  Текст источника:
  ---
  {source_text}
  ---

  Для релевантного источника tags — 2–5 коротких тегов на русском
  (тема, регион, организация), пустой список недопустим.

  Верни ТОЛЬКО JSON без markdown-обрамления, без пояснений, строго формат:
  {{"relevant": true/false, "relevance_reason": "1 фраза почему", "title": "...", "summary": "1-2 предложения", "body_md": "3-6 предложений в markdown", "tags": ["..."]}}

# ds_search#420: пересказ (digest) — свой промпт и лимиты (тело длиннее новости)
max_tokens_digest: 1800
num_ctx_digest: 8192
prompt_template_digest: |
  Ты — редактор проекта поддержки семей детей с синдромом Дауна и РАС.
  Готовишь КРАТКИЙ ПЕРЕСКАЗ чужой статьи: читатель должен получить суть
  достаточно подробно, но полный текст остаётся на сайте источника.

  Сначала оцени релевантность: относится ли источник к синдрому Дауна,
  РАС/аутизму, инклюзии, особому детству, помощи таким семьям или НКО
  этой сферы? Общая благотворительность / другие диагнозы / не по теме —
  НЕ релевантно. Если НЕ релевантно — title/summary/body_md пустые,
  quotes и tags — пустые списки.

  Правила пересказа:
  1. Пиши своими словами. Не сохраняй порядок абзацев, структуру и
     формулировки источника; не копируй подряд более 6 слов.
  2. Объём — 8–15 предложений, примерно 25–35% от источника. Структура:
     что произошло / кто участвует / почему это важно / что дальше.
  3. Ничего не добавляй от себя: только факты, имена, даты и цифры из
     источника. Если чего-то нет в источнике — не пиши.
  4. Прямые цитаты — не более 2, каждая не длиннее 25 слов, дословно
     из источника, в «ёлочках» и с атрибуцией («, — говорит имя, должность»).
     Цитаты дублируй в поле quotes без кавычек-ёлочек.
  5. Не пиши фразу про полный текст и ссылку на источник — её добавит система.
  6. Тон спокойный, без канцелярита и без рекламных оборотов.

  Источник: {source_name}
  URL: {source_url}
  Заголовок источника: {source_title}
  Текст источника:
  ---
  {source_text}
  ---

  tags — 2–5 коротких тегов на русском (тема, регион, организация).

  Верни ТОЛЬКО JSON без markdown-обрамления, без пояснений, строго формат:
  {{"relevant": true/false, "relevance_reason": "1 фраза почему", "title": "...", "summary": "1-2 предложения", "body_md": "8-15 предложений в markdown, цитаты в «ёлочках»", "quotes": ["..."], "tags": ["..."]}}
