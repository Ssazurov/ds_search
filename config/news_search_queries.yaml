# Темы поиска для cron-автосбора новостей (issue #61, ADR-003).
# Каждая запись — отдельный запрос в SearchProviderChain за один прогон.
# max_results_per_query — сколько результатов брать по каждому запросу
# (не путать с probe_max_bytes из discovery — здесь ограничение на
# ширину поиска, чтобы не выбрать всю дневную квоту провайдера за один
# прогон при 1 разе/час).
max_results_per_query: 5

queries:
  - query: "синдром Дауна новости"
  - query: "ранняя помощь дети с синдромом Дауна"
  - query: "инклюзивное образование синдром Дауна"
  - query: "расстройство аутистического спектра новости"
